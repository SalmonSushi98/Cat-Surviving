<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>길고양이로 살아남기</title>
    <link rel="stylesheet" href="style.css">
    <script src="dialogue.js" defer></script>
    <script src="main.js" defer></script>
  </head>
  <body>
    <div id="container">
      <div id="introWindow">
        <div id="introMenuBoard">
          <button class="introMenu">시작하기</button>
          <button class="introMenu">도움말</button>
        </div>
      </div>
      <div id="modal">
        <div id="popup">
          <div id="modalContent">
            <span class="close">&times;</span>
            <div id="modalMessage"></div>
          </div>
        </div>
      </div>
      <div id="whiteModal"></div>
      <div id="startWindow">
        <button id="skipBtn">skip</button>
        <div id="startMain">
          <span id="startDialogue">............<br>.......</span>
        </div>
        <div id="startSelect">
          <button id="next">다음</button>
        </div>
      </div>
      <div id="gameWindow">
        <div id="mainArea">
          <div id="game">
            <div id="story">
              <div id="storyDialogue">무엇을 할까?</div>
              <div id="restTimer" style="display: none"></div>
            </div>
            <div id="itemBox" style="display: none">
              <table>
                <tr>
                  <th class="th"></th>
                  <th class="th"></th>
                  <th class="th"></th>
                </tr>
                <tr>
                  <th class="th"></th>
                  <th class="th"></th>
                  <th class="th"></th>
                </tr>
                <tr>
                  <th class="th"></th>
                  <th class="th"></th>
                  <th class="th"></th>
                </tr>
              </table>
            </div>
            <div id="storyOpt">
              <div id="optBox1">
                <div class="sOpt"></div>
                <div class="sOpt"></div>
                <div class="sOpt"></div>
              </div>
              <div id="optBox2">
                <button id="storyNext">다음</button>
              </div>
            </div>
            <div id="itemInfo">
              <div id="detailInfo"></div>
            </div>
          </div>
          <div id="location" style="display: none">
            <div>한번 이동 시 체력 15 소모</div>
            <div class="loc">중앙광장</div>
            <div class="loc">민주광장</div>
            <div class="loc">정경대후문</div>
            <div class="loc">다람쥐길</div>
            <div class="loc">법과대후문</div>
            <div class="loc">중앙광장지하</div>
          </div>
          <div id="empty"></div>
          <div id="gameMenu">
            <button class="gameOpt">위치이동</button><br>
            <button class="gameOpt">도구함</button><br>
            <button class="gameOpt">휴식하기</button><br>
            <button class="gameOpt">메인으로</button>
          </div>
        </div>
        <div id="infoArea">
          <div id="profile"></div>
          <table>
            <tr>
              <th id="th1">이름:</th>
              <th id="userName"></th>
              <th id="th3">체력:</th>
              <th id="th4"><span id="HP"></span>/100</th>
            </tr>
            <tr>
              <th >위치:</th>
              <th id="place"></th>
              <th >상태:</th>
              <th id="condition">정상</th>
            </tr>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
